<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DDUC Student Verification</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f6f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #0d47a1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 14px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loader p {
      color: #6c757d;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p>Verifying Credentials...</p>
  </div>

  <iframe id="appFrame" allow="geolocation; camera"></iframe>

  <script>
    // Updated Google Apps Script Web App Deployment Endpoint
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzRPrXQzXL_tUsNlSJJvWHD-7gSju0kB6uwGJA6WNj7ptccS0sut_hleczi4XnzBB_M/exec";
    
    const iframe = document.getElementById("appFrame");
    const loader = document.getElementById("loader");

    // Forward URL parameters (?g=groupKey&t=token) from GitHub Pages to Google Apps Script
    const queryString = window.location.search;
    iframe.src = WEB_APP_URL + queryString;

    // Hide loader once the Apps Script HTML content finishes loading
    iframe.onload = function() {
      loader.style.opacity = "0";
      setTimeout(function() {
        loader.style.display = "none";
      }, 300);
    };
  </script>

</body>
</html>
