<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DDUC Student Verification</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents double scrollbars */
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Full screen iframe that hides the Google URL from Android */
        #app-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            position: relative;
            z-index: 10;
        }

        /* Loading screen while Apps Script wakes up */
        .loader-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #1e3877;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #718096;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Loading UI -->
    <div class="loader-container" id="loader">
        <div class="spinner"></div>
        <div class="loading-text">Verifying Record...</div>
    </div>

    <!-- The container for the Google Apps Script Web App -->
    <iframe id="app-frame" allowfullscreen></iframe>

    <script>
        // 1. Get the parameters passed by the QR code
        const urlParams = new URLSearchParams(window.location.search);
        const group = urlParams.get('g');
        const token = urlParams.get('t');
        
        // 2. The exact URL to your deployed Apps Script Web App
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyk5fePuNm78PnIm3MyujLkcFPD0AFmIAJbj0zsBoUgoB5_vLJnx1NDFbXdvjIoE6EWwQ/exec";
        
        // 3. Your security lock parameter
        const authLock = "dduc_gh_auth_2026";

        const iframe = document.getElementById('app-frame');
        const loader = document.getElementById('loader');

        if (group && token) {
            // Construct the secure URL
            const fullUrl = `${WEB_APP_URL}?g=${encodeURIComponent(group)}&t=${encodeURIComponent(token)}&lock=${authLock}`;
            
            // Load the Google Script inside the iframe
            iframe.src = fullUrl;

            // Hide the loading spinner once the iframe has loaded
            iframe.onload = function() {
                loader.style.display = 'none';
            };
        } else {
            // Handle cases where someone just visits the GitHub page directly without a QR code
            loader.innerHTML = `
                <div style="font-size: 40px; margin-bottom: 10px;">📷</div>
                <div style="color: #c62828; font-weight: bold; font-size: 18px;">Scan Required</div>
                <div style="color: #718096; font-size: 14px; margin-top: 5px;">Please scan an official student QR code.</div>
            `;
        }
    </script>
</body>
</html>
