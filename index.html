<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDUC ID Verification</title>
    <style>
        body { margin: 0; background: #f1f5f9; font-family: -apple-system, sans-serif; overflow: hidden; }
        /* Pushes the Google banner up and out of view */
        iframe { width: 100%; height: calc(100vh + 36px); border: none; margin-top: -36px; display: block; }
        
        /* Floating fallback for strict mobile scanners */
        .scanner-fallback { position: fixed; bottom: 0; left: 0; width: 100%; background: #0f1626; padding: 15px 0; text-align: center; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); z-index: 9999; }
        .scanner-fallback span { color: white; font-size: 13px; margin-right: 10px; }
        .btn { background: #ffffff; color: #1e3877; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

    <div class="scanner-fallback">
        <span>Screen blank or stuck?</span>
        <a id="direct-link" href="#" class="btn" target="_blank">Open ID Natively</a>
    </div>

    <iframe id="app-frame" src=""></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const g = urlParams.get('g') || '';
        const t = urlParams.get('t') || '';
        
        // Ensure this is your NEW DU Web App URL
        const webAppUrl = "https://script.google.com/macros/s/AKfycbyk5fePuNm78PnIm3MyujLkcFPD0AFmIAJbj0zsBoUgoB5_vLJnx1NDFbXdvjIoE6EWwQ/exec";
        const secretLockKey = "dduc_gh_auth_2026";

        if (g && t) {
            const targetUrl = webAppUrl + "?g=" + encodeURIComponent(g) + "&t=" + encodeURIComponent(t) + "&lock=" + secretLockKey;
            document.getElementById('app-frame').src = targetUrl;
            document.getElementById('direct-link').href = targetUrl;
        } else {
            document.body.innerHTML = "<h3 style='text-align:center; color:#c62828; margin-top:50px;'>❌ Invalid QR Scan</h3>";
        }
    </script>
</body>
</html>
