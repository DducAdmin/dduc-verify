<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DDUC Student Verification</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: #f4f6f8;
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="verifierFrame"></iframe>

  <script>
    (function() {
      // Your Apps Script Exec Deployment URL
      const APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbzRPrXQzXL_tUsNlSJJvWHD-7gSju0kB6uwGJA6WNj7ptccS0sut_hleczi4XnzBB_M/exec";
      
      // Captures query string (?g=...&t=...) from the QR scan URL
      const currentSearchParams = window.location.search;
      
      // Pass parameters into the Apps Script iframe
      const frame = document.getElementById("verifierFrame");
      frame.src = APPS_SCRIPT_EXEC_URL + currentSearchParams;
    })();
  </script>
</body>
</html>
