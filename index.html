<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDUC Student Verification</title>
    <style>
        body {
            font-family: "Segoe UI", -apple-system, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background-color: #ffffff;
            max-width: 400px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 30px 20px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .logo-placeholder {
            width: 60px;
            height: 60px;
            background-color: #1e3877;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 15px auto;
        }
        h1 {
            color: #0f1626;
            font-size: 20px;
            margin: 0 0 10px 0;
        }
        p {
            color: #718096;
            font-size: 14px;
            margin: 0 0 25px 0;
            line-height: 1.5;
        }
        .btn {
            background-color: #1e3877;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            display: inline-block;
            width: 80%;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(30, 56, 119, 0.2);
            transition: background-color 0.2s;
        }
        .btn:active {
            background-color: #0f1626;
        }
        #error-msg {
            display: none;
            color: #dc2626;
            background-color: #fee2e2;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-placeholder">✓</div>
        <h1>DDUC Verification</h1>
        <p>You have scanned a secure student ID. Tap the button below to verify this record in your browser.</p>
        
        <!-- The target="_blank" forces Android to break out of the scanner app and open Chrome -->
        <a id="verify-btn" href="#" class="btn" target="_blank">View ID Record</a>
        
        <div id="error-msg">Invalid QR Code scanned. No security token found.</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const group = urlParams.get('g');
        const token = urlParams.get('t');
        
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw_NbCYX3mHW8fHV6cDKDOfOKVYyV5P8VegSEttj9gO5QzgRmE4L3TamSDkq3gR3B3PZw/exec";
        const authLock = "dduc_gh_auth_2026";

        const btn = document.getElementById('verify-btn');
        const errorMsg = document.getElementById('error-msg');

        if (group && token) {
            // Construct the final backend URL and attach it directly to the button
            btn.href = `${WEB_APP_URL}?g=${encodeURIComponent(group)}&t=${encodeURIComponent(token)}&lock=${authLock}`;
        } else {
            // Disable button if scanned incorrectly
            btn.style.display = 'none';
            errorMsg.style.display = 'block';
        }
    </script>

</body>
</html>
